<body>
<style>
:root{
  --f-ui:'IBM Plex Sans Thai',"Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;
  --f-plate:'Chakra Petch','IBM Plex Sans Thai',"Noto Sans Thai",Tahoma,sans-serif;
  --bg:#ECEEF0; --surface:#FFFFFF; --surface-2:#F1F2F4; --ink:#1C2024; --ink-2:#5A6068; --line:#D3D6DA; color-scheme:light;
  --plate:#D8DBDF; --plate-hole:#C2C6CB;
  --accent:#D90016; --accent-ink:#FFFFFF; --warn:#E60012; --live:#E60012; --live-soft:rgba(230,0,18,.5);
  --ok:#2E9E4F; --bad:#D13A2E; --hold:#8A9097; --off:#8D9298; --wire-edge:rgba(0,0,0,.35);
  --bevel:inset 0 1px 0 rgba(255,255,255,.7), 0 2px 0 rgba(0,0,0,.14);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;max-width:1180px;margin:0 auto;position:relative}
#map{max-width:820px;margin:0 auto;width:100%}
.screen{height:100%;display:flex;flex-direction:column}

/* ---------- map ---------- */
#map{overflow-y:auto;padding:16px 16px 28px}
#map>*{flex-shrink:0}
.nameplate{background:#2A2E33;color:#ECEDE9;border-radius:10px;padding:18px 18px 16px;position:relative;box-shadow:0 3px 0 #1E2226}
.nameplate::before,.nameplate::after{content:"";position:absolute;top:10px;width:9px;height:9px;border-radius:50%;background:#9BA1A7;box-shadow:inset -2px -2px 0 #6A7077}
.nameplate::before{left:10px}.nameplate::after{right:10px}
.nameplate h1{font-family:var(--f-plate);font-weight:700;font-size:30px;line-height:1.1;margin:4px 0 4px;letter-spacing:.5px}
.nameplate h1 span{display:inline-block;width:.62em;height:.62em;margin-right:.18em;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px rgba(230,0,18,.25);vertical-align:.04em}
.np-sub{margin:0 0 14px;color:#C2C7CC;font-size:14px}
.rank{background:#262B30;border-radius:8px;padding:10px 12px}
.rank-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rank-name{font-family:var(--f-plate);font-weight:600;font-size:18px;color:#FF9AA2}
.rank-score{font-variant-numeric:tabular-nums;color:#DADDE0}
.bar{height:8px;background:#3A4046;border-radius:4px;margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#E60012 0 10px,#A8000D 10px 20px);border-radius:4px;transition:width .6s}
.rank small{color:#A9AFB5;font-size:12.5px}

.route{position:relative;margin:22px 0 10px;padding-left:34px}
.route::before{content:"";position:absolute;left:14px;top:12px;bottom:12px;width:8px;border-radius:4px;background:repeating-linear-gradient(180deg,#3B4148 0 14px,#30353B 14px 16px)}
.jb{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px;box-shadow:var(--bevel);min-height:64px}
.jb::before{content:"";position:absolute;left:-20px;top:50%;width:20px;height:6px;margin-top:-3px;background:#3B4148}
.jb-num{flex:none;width:38px;height:38px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-plate);font-weight:700;font-size:18px;background:#3B4148;color:#fff;position:relative}
.jb-num::after{content:"";position:absolute;right:-4px;top:-4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface);background:var(--off)}
.jb.done .jb-num::after{background:var(--ok)}
.jb.open .jb-num::after{background:var(--live);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(230,0,18,.25)}}
.jb-body{flex:1;min-width:0;display:flex;flex-direction:column}
.jb-body b{font-family:var(--f-plate);font-weight:600;font-size:17px;line-height:1.25}
.jb-body small{color:var(--ink-2);font-size:13px}
.jb-stars{flex:none;font-size:18px;letter-spacing:1px;color:var(--warn)}
.jb-stars .dim{color:var(--line)}
.jb.locked,.jb.soon{opacity:.62}
.jb.repair{border:2px dashed var(--warn);margin:4px 0 14px}
.jb.repair .jb-num{background:var(--warn);font-size:20px}
.jb.repair .jb-num::after{display:none}
.jb.repair::before{display:none}
#btnMusic.off{opacity:.45}
.faults{margin:0 0 12px;padding-left:20px;font-size:14px}
.faults li{margin:2px 0}
.jb.soon .jb-stars{font-size:12px;color:var(--ink-2);letter-spacing:0}
.map-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:42px;box-shadow:var(--bevel)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.quiet{background:transparent;box-shadow:none}
.btn:active{transform:translateY(1px)}

/* ---------- game ---------- */
.topbar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.topbar .btn{min-height:36px;padding:4px 10px}
.lv{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.lv b{font-family:var(--f-plate);font-weight:600;font-size:16px;line-height:1.2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.lvn{display:inline-block;min-width:20px;height:20px;line-height:20px;padding:0 5px;margin-right:6px;border-radius:6px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;text-align:center;vertical-align:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:420px){.topbar{gap:4px}.topbar .btn{padding:4px 8px}.lv b{font-size:15px}}
.lv small{color:var(--ink-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-family:var(--f-plate);font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink-2);padding:0 4px}
.statusline{display:flex;align-items:center;gap:8px;padding:5px 8px;flex:none;font-size:13px;border-bottom:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 9px 1px 7px;border-radius:20px;background:var(--surface-2);font-weight:600;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--off)}
.pill.on::before{background:var(--ok)}.pill.trip::before{background:var(--bad)}.pill.hum::before{background:var(--hold)}
#stMotor{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.tabs{display:flex;background:var(--surface-2);border-radius:8px;padding:2px;flex:none}
.tabs button{border:0;background:transparent;border-radius:6px;padding:3px 10px;font-size:13px;color:var(--ink-2)}
.tabs button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}

.stage{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;--split:40%}
.pane{flex:1;min-height:0;min-width:0;position:relative;overflow:hidden}
.divider{flex:none;height:16px;display:grid;place-items:center;background:var(--surface-2);cursor:row-resize;touch-action:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.divider::before{content:"";width:46px;height:5px;border-radius:3px;background:var(--ink-2);opacity:.45}
.dtoggle{flex:none;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:20px;padding:3px 12px;font-size:13px;font-weight:600}
.dtoggle[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.dhead{position:sticky;top:-8px;margin:-8px -10px 4px;padding:6px 8px 5px;background:var(--surface);z-index:2;display:flex;gap:6px;flex-wrap:nowrap;justify-content:center;border-bottom:1px solid var(--surface-2)}
.dhead .dstyle button{white-space:nowrap}
.dhead .dstyle{margin:0;max-width:none;flex:none}
.dhead .dstyle button{padding:3px 9px;font-size:12.5px}
@media (min-width:760px){
  .stage{flex-direction:row}
  .divider{width:16px;height:auto;cursor:col-resize;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .divider::before{width:5px;height:46px}
}
#panel{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.ladder{flex:0 0 var(--split);min-height:0;min-width:0;overflow:auto;padding:8px 10px;background:var(--surface)}
.ladder svg{width:100%;max-width:520px;display:block;margin:0 auto 4px}
.ladder p{max-width:520px;margin:8px auto 0;color:var(--ink-2);font-size:13.5px}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--bevel);font-size:18px;line-height:1}
.colors{position:absolute;left:0;right:52px;top:0;display:flex;gap:6px;padding:8px;overflow-x:auto;scrollbar-width:none;background:linear-gradient(rgba(0,0,0,.14),transparent)}
.colors button{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 10px 4px 6px;font-size:13px}
.colors button i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.colors button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.toast{position:absolute;left:10px;right:56px;top:10px;margin:0 auto;max-width:460px;padding:9px 12px;border-radius:8px;background:#2A3036;color:#F1F2EF;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:6;border-left:5px solid var(--accent)}
.toast.show{opacity:1;transform:none}
.toast.bad{border-left-color:var(--bad)}.toast.ok{border-left-color:var(--ok)}.toast.info{border-left-color:var(--warn)}

#game.testing .tray,#game.testing .tools,#game.testing .zoom{display:none}
#game.testing .controls .btn{opacity:.55;pointer-events:none}
.hud{position:absolute;top:8px;left:8px;right:8px;margin:0 auto;max-width:520px;z-index:6;background:var(--surface);border-radius:12px;padding:8px 12px 10px;box-shadow:0 6px 18px rgba(0,0,0,.22);border-left:6px solid var(--live)}
.hud.ok{border-left-color:var(--ok)}.hud.bad{border-left-color:var(--bad)}
.hd-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.bad{background:var(--bad)}.dots i.run{background:var(--live);animation:pulse 1s infinite}
.hd-txt{font-size:15.5px;font-weight:600;line-height:1.35;margin-top:2px}
.hud.ok .hd-txt{color:var(--ok);font-family:var(--f-plate);font-size:18px}
.hd-msg{font-size:14px;color:var(--bad);margin-top:4px;line-height:1.4}
.hd-btns{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
.hd-btns .btn{min-height:38px;padding:4px 12px}
.hud.demo{border-left-color:#2F6FD0}
.wire.w-del .w-core{stroke:#D13A2E!important;stroke-dasharray:6 5}
.wire.w-del{animation:wdel 1.1s ease-in forwards}
@keyframes wdel{0%,45%{opacity:1}100%{opacity:.12}}
.hd-sub{font-size:13px;color:var(--ink-2);margin-top:3px;line-height:1.35}
.hd-prog{height:6px;border-radius:3px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.hd-prog i{display:block;height:100%;background:#2F6FD0;border-radius:3px;transition:width .3s}
.hd-row .hd-skip{flex:none;min-height:30px;padding:2px 9px;font-size:12.5px}
.jb-peek{display:inline-block;font-size:12px;font-weight:600;letter-spacing:0;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:1px 8px;white-space:nowrap;vertical-align:middle}
.controls .btn.power{white-space:normal;line-height:1.15}
.hd-bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.hd-bar i{display:block;height:100%;width:100%;background:var(--live);transform-origin:left;animation:fillbar linear forwards}
@keyframes fillbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tapmark{pointer-events:none}
.tm-ring{fill:none;stroke:var(--accent);stroke-width:3.5}
.tm-pulse{fill:var(--accent);opacity:.25;transform-box:fill-box;transform-origin:center;animation:tmp .9s ease-out infinite}
.tapmark:not(.hold) .tm-ring{animation:tmfade 1.1s ease-out forwards}
.tm-tag{fill:var(--accent)}
.tm-txt{font-family:var(--f-plate)!important;font-size:11px;font-weight:700;fill:#fff}
@keyframes tmp{from{transform:scale(.6);opacity:.45}to{transform:scale(1.5);opacity:0}}
@keyframes tmfade{0%,60%{opacity:1}100%{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.2);padding:12px 14px 14px;z-index:5}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.sheet-h b{font-family:var(--f-plate);font-size:17px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.steps li:last-child{border-bottom:0}
.mk{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--ink-2);margin-top:1px}
.st-run .mk{background:var(--live);color:#FFFFFF;animation:pulse 1s infinite}
.st-ok .mk{background:var(--ok);color:#fff}
.st-bad .mk{background:var(--bad);color:#fff}
.steps small{display:block;color:var(--bad);font-size:13px}
.sheet-f{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint-n{color:var(--ink-2);font-size:13px}
.hint-t{font-size:15.5px;margin:4px 0 6px}

.tray{display:flex;gap:6px;padding:7px 8px;overflow-x:auto;background:var(--surface);border-top:1px solid var(--line);flex:none;scrollbar-width:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);min-height:44px;font-size:13px;line-height:1.2;text-align:left}
.chip svg{width:30px;height:30px;flex:none}
.chip em{font-style:normal;font-family:var(--f-plate);font-weight:600;color:var(--ink-2)}
.chip.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);background:var(--surface)}
.chip.empty{opacity:.45}
.tray-lbl{align-self:center;font-size:13px;font-weight:600;color:var(--ink-2);padding:0 2px 0 4px;white-space:nowrap;flex:none}
.mtr{flex:1 1 100%;min-width:0;max-width:640px;display:flex;align-items:center;gap:10px;min-height:44px;background:#D90016;color:#fff;border-radius:10px;padding:5px 10px 5px 6px;box-shadow:0 2px 0 #9E000F}
.mtr .lcd{flex:none;min-width:96px;background:#B9C7A4;border-radius:6px;padding:3px 8px;font-family:var(--f-plate);font-weight:700;font-size:22px;line-height:1.1;color:#1E2A14;text-align:right;font-variant-numeric:tabular-nums}
.mtr span{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.mtr b{font-family:var(--f-plate);font-size:12px;opacity:.9}
.mtr small{font-size:12.5px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.cchip{padding:4px 12px 4px 8px}
.cchip i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:none}
.tray-empty{color:var(--ink-2);font-size:13px;align-self:center;padding:0 4px}
.tools{display:flex;gap:6px;padding:0 8px 7px;background:var(--surface);flex:none}
.tools .btn{flex:1;min-height:40px;padding:4px 6px;font-size:13.5px;white-space:nowrap}
.tools .btn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.controls{display:flex;gap:6px;padding:7px 8px;background:#2A2E33;flex:none}
.controls .btn{flex:1;min-height:46px;padding:4px 6px;font-size:14px;background:#3A4046;color:#F0F1EE;border-color:#2A2F34;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 2px 0 #1E2226;white-space:nowrap}
.controls .btn.primary{background:var(--accent);color:#fff}
.power{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.pw-led{width:14px;height:14px;border-radius:50%;background:#61676D;box-shadow:inset 0 -2px 0 rgba(0,0,0,.3)}
.power.on .pw-led{background:#3BD16A;box-shadow:0 0 10px #3BD16A}
.power.trip .pw-led{background:#FF5446;box-shadow:0 0 10px #FF5446}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(15,18,21,.55);display:grid;place-items:center;padding:16px;z-index:20}
.card{background:var(--surface);color:var(--ink);border-radius:14px;max-width:440px;width:100%;max-height:calc(100% - 20px);overflow:auto;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.card h2{font-family:var(--f-plate);font-weight:700;font-size:22px;line-height:1.2;margin:0 0 6px}
.card .meta{color:var(--ink-2);font-size:13.5px;margin:0 0 12px}
.who{display:flex;gap:12px;align-items:flex-start;margin:10px 0 12px}
.avatar{flex:none;width:46px;height:46px;border-radius:50%;background:#E60012;color:#FFFFFF;display:grid;place-items:center;font-family:var(--f-plate);font-weight:700;font-size:20px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.bubble{background:var(--surface-2);border-radius:4px 12px 12px 12px;padding:10px 12px;font-size:15px}
.bubble b{display:block;font-size:13px;color:var(--ink-2);font-weight:600}
.goalbox{border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.goalbox ul{list-style:none;margin:0;padding:0}
.goalbox li{display:flex;gap:8px;padding:3px 0;font-size:14.5px}
.goalbox li span{flex:none;width:20px;color:var(--warn);font-weight:700}
.goalbox li.got span{color:var(--ok)}
.card .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:6px}
.bigstars{font-size:46px;letter-spacing:6px;text-align:center;color:var(--warn);line-height:1.1;margin:4px 0 6px}
.bigstars .dim{color:var(--line)}
.bigstars span{display:inline-block;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}}
.score{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:14.5px}
.score td{padding:5px 0;border-bottom:1px dashed var(--line)}
.score td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.score tr.total td{border-bottom:0;font-family:var(--f-plate);font-size:18px}

/* ---------- svg devices ---------- */
.plate-bg{fill:var(--plate)}
.plate-hole{fill:var(--plate-hole)}
.plate-edge{fill:none;stroke:var(--line);stroke-width:2}
svg text{font-family:var(--f-ui);user-select:none;pointer-events:none}
.d-dev{fill:#ECEAE3;stroke:#9C9A92;stroke-width:1.2}
.d-supply{fill:#3A4048;stroke:#262A30;stroke-width:1.2}
.d-title{fill:#E8EAE6;font-family:var(--f-plate)!important;font-weight:600;font-size:11px}
.d-tl{fill:#E8EAE6;font-family:var(--f-plate)!important;font-weight:700;font-size:11px}
.brk-body{fill:#F1F0EB;stroke:#8D8C85}
.brk-lever{fill:#5B6168;transition:transform .2s,fill .2s;transform:translateY(6px)}
.brk-on .brk-lever{transform:none;fill:var(--ok)}
.brk-trip .brk-lever{transform:translateY(3px);fill:var(--bad)}
.brk-txt{font-family:var(--f-plate)!important;font-size:8px;font-weight:700;fill:#3A3F44}
.brk-trip .brk-txt{fill:var(--bad)}
.t-num{font-size:9.5px;font-weight:600;fill:#2B2F33}
.t-tiny{font-size:8px;fill:#6A6F74}
.d-lbl{font-family:var(--f-plate)!important;font-size:10px;font-weight:700;fill:#2B2F33}
.d-tag{font-family:var(--f-plate)!important;font-size:12px;font-weight:700;fill:#2B2F33}
.sw-plate{fill:#D6D3CA}
.sw-rocker{fill:#3B4046;transition:fill .15s}
.c-on .sw-rocker{fill:#E60012}
.sw-mark{fill:#ECEAE3;transition:transform .15s;transform:translateY(18px)}
.c-on .sw-mark{transform:none}
.pb-ring{fill:#2F3439}
.pb-cap{transition:transform .08s;transform-box:fill-box;transform-origin:center}
.c-pressed .pb-cap{transform:scale(.84)}
.pb-green{fill:#2E9E4F}.pb-red{fill:#D13A2E}.pb-blue{fill:#3F454C}.pb-gray{fill:#7A838C}
.d-ol{fill:#E2DED3;stroke:#99968D;stroke-width:1.2}
.ol-sep{stroke:#B9B5AA;stroke-width:1;stroke-dasharray:3 3}
.ol-win{fill:#2F3439;transition:fill .15s}
.ol-flag{font-family:var(--f-plate)!important;font-size:10px;font-weight:700;fill:#9AA3AB}
.c-trip .ol-win{fill:#E60012}
.c-trip .ol-flag{fill:#FFFFFF}
.t-lampRed .lamp-lens{fill:#6E3C37}
.t-lampRed.c-on .lamp-lens{fill:#FF8070}
.t-lampRed .lamp-glow{fill:#FF8070}
.tr-dial{fill:#2F3439}
.tr-arc{fill:none;stroke:#E60012;stroke-width:4;stroke-dasharray:106.8;stroke-dashoffset:106.8}
.tr-txt{font-family:var(--f-plate)!important;font-size:10px;font-weight:700;fill:#E6E8E5}
.tr-led{fill:#5B5F63}
.tr-run .tr-led{fill:#E60012}.tr-done .tr-led{fill:#3BD16A}.tr-done .tr-arc{stroke:#3BD16A}
.mt-mode{font-family:var(--f-plate)!important;font-size:18px;font-weight:700;fill:#E60012}
.c-chatter .ct-arm{animation:chat .09s steps(2) infinite}
@keyframes chat{50%{transform:translateY(8px)}}
.probe{pointer-events:none}
.probe circle{fill:none;stroke-width:3}
.probe.red circle{stroke:#E5352B}.probe.black circle{stroke:#111;}
.probe text{font-family:var(--f-plate)!important;font-size:10px;font-weight:700}
.probe.red text{fill:#E5352B}.probe.black text{fill:#111}
.dstyle{display:flex;max-width:260px;margin:0 auto 8px;background:var(--surface-2);border-radius:9px;padding:3px}
.dstyle button{flex:1;border:0;background:transparent;border-radius:7px;padding:6px 8px;font-size:14px;color:var(--ink-2);font-family:var(--f-plate);font-weight:600}
.dstyle button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.ld-p{font-family:var(--f-plate)!important;font-size:11px;font-weight:700;fill:var(--ink-2)}
.ld-mir{font-size:9.5px;fill:var(--ink-2)}
.ld-link{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:4 3;fill:none}
.d-ct{fill:#E9E6DE;stroke:#99968D;stroke-width:1.2}
.d-ct-strip{fill:#D2CFC5}
.ct-win{fill:#2F3439}
.ct-arm{fill:#8B939B;transition:transform .07s}
.c-on .ct-arm{transform:translateY(12px)}
.ct-led{fill:#5B5F63}
.c-on .ct-led{fill:#3BD16A}
.lamp-bezel{fill:#2F3439}
.lamp-lens{fill:#4E6A54;transition:fill .15s}
.c-on .lamp-lens{fill:#9AF7A6}
.lamp-glow{fill:#9AF7A6;opacity:0;transition:opacity .2s}
.c-on .lamp-glow{opacity:.5}
.mt-box{fill:#4A5866;stroke:#36414C}
.mt-box-t{fill:#E3E8EC;font-family:var(--f-plate)!important;font-size:10px;font-weight:700}
.mt-body{fill:#5C6E80;stroke:#3C4A57;stroke-width:2}
.mt-fins{fill:none;stroke:#4A5A69;stroke-width:7;stroke-dasharray:3 4}
.mt-fan-bg{fill:#26303A}
.mt-blade{fill:#C8D2DB}
.mt-mark{fill:#E60012}
.mt-hub{fill:#8796A4}
.mt-led{fill:#6C7177}
.m-run .mt-led{fill:#3BD16A}
.m-hum .mt-led{fill:#E60012}
.comp.sel .sel-ring{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-dasharray:6 4}
.comp .sel-ring{fill:none;stroke:none}
.comp.bad .sel-ring{stroke:var(--bad);stroke-width:2.5}

.term .t-hit{fill:transparent}
.term .t-screw{fill:#C9CDD2;stroke:#6E747B;stroke-width:1.2}
.term .t-slot{stroke:#5E646B;stroke-width:1.5;stroke-linecap:round}
.term.hot .t-screw{fill:#F6DDA6;stroke:#C98A12}
.mode-wire .term .t-screw{stroke:var(--accent);stroke-width:2}
.term.t-start .t-screw{fill:var(--accent);stroke:#fff}
.term.t-start .t-ring{stroke:var(--accent);stroke-width:2.5;fill:none;animation:ring 1s ease-out infinite}
.term .t-ring{fill:none}
@keyframes ring{from{opacity:1;r:7}to{opacity:0;r:16}}

.wire{cursor:pointer}
#lyWireDim{opacity:.32;pointer-events:none}
#lySel{pointer-events:none}
.lk{fill:#7D838A;stroke:#7D838A}
.t-supply3 .lk,.t-supply1 .lk{fill:#AEB5BC;stroke:#AEB5BC}
.wire .w-hit{stroke:transparent;stroke-width:16;fill:none}
.wire .w-edge{stroke:var(--wire-edge);stroke-width:5.6;fill:none;stroke-linecap:round}
.wire .w-core{stroke-width:3.4;fill:none;stroke-linecap:round}
.wire .w-flow{stroke:#FFE7A8;stroke-width:2;fill:none;stroke-dasharray:2 10;stroke-linecap:round;opacity:0}
.wire.flow .w-edge{stroke:var(--live-soft);stroke-width:8}
.wire.flow .w-flow{opacity:1;animation:flow .55s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.wire.sel .w-edge{stroke:var(--accent);stroke-width:8}
.preview{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 5;fill:none;pointer-events:none}
.ghost{pointer-events:none;stroke-width:2;stroke-dasharray:6 4;rx:6}
.ghost.ok{fill:rgba(46,158,79,.18);stroke:var(--ok)}
.ghost.bad{fill:rgba(209,58,46,.18);stroke:var(--bad)}
.spark line{stroke:#FFE36B;stroke-width:3;stroke-linecap:round;animation:spark .6s ease-out forwards}
.spark circle{fill:#FFF6C4;animation:flash .6s ease-out forwards}
@keyframes spark{from{opacity:1;stroke-dashoffset:0}to{opacity:0;transform:scale(1.8)}}
@keyframes flash{from{opacity:1}to{opacity:0;transform:scale(2.5)}}
.spark *{transform-box:fill-box;transform-origin:center}

/* ladder */

<script>
(()=>{
'use strict';
let PW=400, PH=540;const GRID=10;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const snap=v=>Math.round(v/GRID)*GRID;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};

/*ENGINE-START*/
class UF{
  constructor(){this.p=new Map()}
  find(a){const p=this.p;if(!p.has(a)){p.set(a,a);return a}let r=a;while(p.get(r)!==r)r=p.get(r);while(p.get(a)!==r){const n=p.get(a);p.set(a,r);a=n}return r}
  union(a,b){const x=this.find(a),y=this.find(b);if(x!==y)this.p.set(x,y)}
}
const CT_TOP=['A1','1','3','5','13','21'], CT_BOT=['A2','2','4','6','14','22'];
const T={
  supply3:{name:'แหล่งจ่าย 3 เฟส',en:'Three-phase supply',tag:'PS',w:200,h:58,lk:[182,41],
    terms:[['L1',26,52,'b'],['L2',64,52,'b'],['L3',102,52,'b'],['N',140,52,'b']],
    sources:{L1:'L1',L2:'L2',L3:'L3',N:'N'},
    draw:c=>supplyDraw(200,I('แหล่งจ่าย 3 เฟส 380/220 V','3-phase supply 380/220 V'),[['L1',26],['L2',64],['L3',102],['N',140]])},
  supply1:{name:'ไฟบ้าน 1 เฟส',en:'Single-phase supply',tag:'PS',w:130,h:58,lk:[112,41],
    terms:[['L',30,52,'b'],['N',66,52,'b']],
    sources:{L:'L1',N:'N'},
    draw:c=>supplyDraw(130,I('ไฟบ้าน 220 V','Mains 220 V'),[['L',30],['N',66]])},
  switch:{name:'สวิตช์',en:'switch',tag:'S',w:60,h:84,lk:[8,3],sh:[['r',4,0,52,84,6]],
    terms:[['1',30,6,'t'],['2',30,78,'b']],
    contacts:s=>s.on?[['1','2']]:[],
    draw:c=>`<rect class="d-dev" x="4" y="0" width="52" height="84" rx="6"/>
      <text class="t-num" x="42" y="12">1</text><text class="t-num" x="42" y="80">2</text>
      <g data-act="toggle"><rect class="sw-plate" x="12" y="18" width="36" height="46" rx="4"/>
      <rect class="sw-rocker" x="16" y="22" width="28" height="38" rx="3"/>
      <rect class="sw-mark" x="25" y="26" width="10" height="7" rx="1.5"/></g>
      <text class="t-tiny" x="8" y="80">${esc(c.id)}</text>`},
  pbStart:{name:'ปุ่ม START',en:'START button',tag:'SB',w:64,h:86,lk:[50,16],sh:[['r',2,0,60,86,6]],
    terms:[['3',32,6,'t'],['4',32,80,'b']],
    contacts:s=>s.pressed?[['3','4']]:[],
    draw:c=>pbDraw(c,'START','pb-green','3','4','NO')},
  pbStop:{name:'ปุ่ม STOP',en:'STOP button',tag:'SB',w:64,h:86,lk:[50,16],sh:[['r',2,0,60,86,6]],
    terms:[['1',32,6,'t'],['2',32,80,'b']],
    contacts:s=>s.pressed?[]:[['1','2']],
    draw:c=>pbDraw(c,'STOP','pb-red','1','2','NC')},
  contactor:{name:'คอนแทคเตอร์',en:'contactor',tag:'K',w:156,h:150,lk:[137,60],sh:[['r',0,0,156,150,8]],
    terms:[...CT_TOP.map((n,i)=>[n,18+i*24,7,'t']),...CT_BOT.map((n,i)=>[n,18+i*24,143,'b'])],
    contacts:s=>s.on?[['1','2'],['3','4'],['5','6'],['13','14']]:[['21','22']],
    draw:c=>ctDraw(c)},
  pbJog:{name:'ปุ่ม JOG',en:'JOG button',tag:'SB',w:76,h:86,lk:[62,18],sh:[['r',2,0,72,86,6]],
    terms:[['1',20,6,'t'],['3',52,6,'t'],['2',20,80,'b'],['4',52,80,'b']],
    contacts:s=>s.pressed?[['3','4']]:(s.mid?[]:[['1','2']]),
    draw:c=>`<rect class="d-dev" x="2" y="0" width="72" height="86" rx="6"/>
      <text class="t-num" x="29" y="13">1</text><text class="t-num" x="61" y="13">3</text>
      <text class="t-num" x="29" y="83">2</text><text class="t-num" x="61" y="83">4</text>
      <text class="t-tiny" x="6" y="25">NC</text><text class="t-tiny" x="58" y="25">NO</text>
      <g data-act="push"><circle class="pb-ring" cx="38" cy="42" r="19"/><circle class="pb-cap pb-gray" cx="38" cy="42" r="14.5"/></g>
      <text class="d-lbl" x="38" y="72" text-anchor="middle">JOG</text>`},
  pbFwd:{name:'ปุ่มเดินหน้า FWD',en:'FWD button',tag:'SB',w:64,h:86,lk:[50,16],sh:[['r',2,0,60,86,6]],
    terms:[['3',32,6,'t'],['4',32,80,'b']],
    contacts:s=>s.pressed?[['3','4']]:[],
    draw:c=>pbDraw(c,'FWD','pb-green','3','4','NO')},
  pbRev:{name:'ปุ่มถอยหลัง REV',en:'REV button',tag:'SB',w:64,h:86,lk:[50,16],sh:[['r',2,0,60,86,6]],
    terms:[['3',32,6,'t'],['4',32,80,'b']],
    contacts:s=>s.pressed?[['3','4']]:[],
    draw:c=>pbDraw(c,'REV','pb-blue','3','4','NO')},
  overload:{name:'โอเวอร์โหลดรีเลย์',en:'overload relay',tag:'OL',w:130,h:96,lk:[25,54],sh:[['r',0,0,130,96,7]],
    terms:[['1',18,7,'t'],['3',40,7,'t'],['5',62,7,'t'],['95',92,7,'t'],['97',114,7,'t'],
           ['2',18,89,'b'],['4',40,89,'b'],['6',62,89,'b'],['96',92,89,'b'],['98',114,89,'b']],
    contacts:s=>[['1','2'],['3','4'],['5','6'],s.tripped?['97','98']:['95','96']],
    draw:c=>olDraw(c)},
  timer:{name:'ไทเมอร์หน่วงเวลา',en:'on-delay timer',tag:'TR',w:100,h:110,lk:[84,56],sh:[['r',0,0,100,110,7]],
    terms:[['A1',18,7,'t'],['15',70,7,'t'],['A2',18,103,'b'],['16',55,103,'b'],['18',82,103,'b']],
    contacts:s=>s.done?[['15','18']]:[['15','16']],
    draw:c=>timerDraw(c)},
  motor6:{name:'มอเตอร์ 6 ขั้ว',en:'6-terminal motor',tag:'M',w:180,h:150,rc:[90,98],lk:[6,120],sh:[['r',4,0,172,32,4],['r',80,32,20,10,0],['c',90,98,50],['r',0,116,64,34,3]],
    terms:[['U1',20,8,'t'],['V1',48,8,'t'],['W1',76,8,'t'],['U2',104,8,'t'],['V2',132,8,'t'],['W2',160,8,'t']],
    draw:c=>motor6Draw(c)},
  lamp:{name:'หลอดไฟเขียว',en:'green lamp',tag:'H',w:60,h:74,lamp:true,lk:[7,4],sh:[['r',4,0,52,74,6]],
    terms:[['X1',30,6,'t'],['X2',30,68,'b']],
    draw:c=>lampDraw(c)},
  lampRed:{name:'หลอดไฟแดง',en:'red lamp',tag:'H',w:60,h:74,lamp:true,lk:[7,4],sh:[['r',4,0,52,74,6]],
    terms:[['X1',30,6,'t'],['X2',30,68,'b']],
    draw:c=>lampDraw(c)},
  motor:{name:'มอเตอร์ 3 เฟส',en:'3-phase motor',tag:'M',w:130,h:142,lk:[114,8],sh:[['r',20,0,90,32,4],['c',65,90,50],['r',0,126,64,16,3]],
    terms:[['U',40,8,'t'],['V',65,8,'t'],['W',90,8,'t']],
    draw:c=>motorDraw(c)}
};
function solve(S){
  const live=S.power&&!S.tripped;
  const res={short:false,chatter:false,lit:{},coil:{},motor:{},mode:{},speed:{},src:{},hot:new Set(),flow:new Set(),hotWire:new Set()};
  let uf,src;
  const build=()=>{
    uf=new UF();
    for(const w of S.wires) if(!w.broken) uf.union(w.a,w.b);
    for(const c of S.comps){const D=T[c.type];if(D.contacts)for(const [p,q] of D.contacts(c.state))uf.union(c.id+':'+p,c.id+':'+q)}
    src=new Map();
    if(live)for(const c of S.comps){const D=T[c.type];if(D.sources)for(const t in D.sources){const r=uf.find(c.id+':'+t);if(!src.has(r))src.set(r,new Set());src.get(r).add(D.sources[t])}}
  };
  const s1=ref=>{const set=src.get(uf.find(ref));return set&&set.size===1?[...set][0]:null};
  const energ=(a,b)=>{const x=s1(a),y=s1(b);return !!(x&&y&&x!==y)};
  const shorted=()=>{for(const set of src.values())if(set.size>1)return true;return false};
  let stable=false;
  for(let i=0;i<20;i++){
    build();
    if(shorted()){res.short=true;return res}
    let changed=false;
    for(const c of S.comps)if(c.type==='contactor'){const on=energ(c.id+':A1',c.id+':A2');if(!!c.state.on!==on){c.state.on=on;changed=true}}
    for(const c of S.comps)if(c.type==='timer'){const on=energ(c.id+':A1',c.id+':A2');
      if(on&&!c.state.run){c.state.run=true;c.state.t0=S.now||0;c.state.done=false}
      if(!on&&c.state.run){c.state.run=false;if(c.state.done){c.state.done=false;changed=true}}}
    if(!changed){stable=true;break}
  }
  if(!stable){res.chatter=true;build();if(shorted()){res.short=true;return res}}
  const imp=new Set();
  for(const c of S.comps){
    const D=T[c.type];
    for(const tm of D.terms){const ref=c.id+':'+tm[0];const sv=s1(ref);if(sv){res.hot.add(ref);res.src[ref]=sv}}
    if(D.sources)for(const t in D.sources){const ref=c.id+':'+t;if(s1(ref))imp.add(ref)}
    if(D.lamp){const on=energ(c.id+':X1',c.id+':X2');res.lit[c.id]=on;if(on){imp.add(c.id+':X1');imp.add(c.id+':X2')}}
    if(c.type==='contactor'||c.type==='timer'){const on=energ(c.id+':A1',c.id+':A2');res.coil[c.id]=on;if(on){imp.add(c.id+':A1');imp.add(c.id+':A2')}}
    if(c.type==='motor6'){
      const P=['L1','L2','L3'],g=n=>s1(c.id+':'+n),rt=n=>uf.find(c.id+':'+n);
      const [U1,V1,W1,U2,V2,W2]=['U1','V1','W1','U2','V2','W2'].map(g);
      const idx=[U1,V1,W1].map(p=>P.indexOf(p));
      const star=!U2&&rt('U2')===rt('V2')&&rt('V2')===rt('W2');
      let m=0,mode=null,spd=1;
      if(idx.every(i=>i>=0)&&new Set(idx).size===3){
        const k=idx.join(''),dir=(k==='012'||k==='120'||k==='201')?1:-1;
        if(star){m=dir;mode='star';spd=.55}
        else if([U2,V2,W2].every(p=>P.includes(p))&&U2!==U1&&V2!==V1&&W2!==W1&&new Set([U2,V2,W2]).size===3){m=dir;mode='delta'}
        else m='hum';
      }else if(new Set([U1,V1,W1,U2,V2,W2].filter(Boolean)).size>=2)m='hum';
      res.motor[c.id]=m;res.mode[c.id]=mode;res.speed[c.id]=spd;
      if(m!==0)D.terms.forEach(t=>{const r=c.id+':'+t[0];if(s1(r)||(star&&/2$/.test(t[0])))imp.add(r)});
    }
    if(c.type==='motor'){
      const ph=['U','V','W'].map(t=>s1(c.id+':'+t));
      const idx=ph.map(p=>['L1','L2','L3'].indexOf(p));
      const distinct=new Set(ph.filter(Boolean));
      let m=0;
      if(idx.every(i=>i>=0)&&new Set(idx).size===3){const k=idx.join('');m=(k==='012'||k==='120'||k==='201')?1:-1}
      else if(distinct.size>=2)m='hum';
      res.motor[c.id]=m;
      if(m!==0)['U','V','W'].forEach(t=>{const r=c.id+':'+t;if(s1(r))imp.add(r)});
    }
  }
  const edges=[];
  for(const w of S.wires){if(w.broken)continue;if(res.hot.has(w.a)||res.hot.has(w.b))res.hotWire.add(w.id);if(res.hot.has(w.a)||res.hot.has(w.b))edges.push({a:w.a,b:w.b,w:w.id,on:true})}
  for(const c of S.comps){const D=T[c.type];if(D.contacts)for(const [p,q] of D.contacts(c.state)){const a=c.id+':'+p;if(res.hot.has(a))edges.push({a,b:c.id+':'+q,w:null,on:true})}}
  let ch=true;
  while(ch){
    ch=false;const deg=new Map();
    for(const e of edges)if(e.on){deg.set(e.a,(deg.get(e.a)||0)+1);deg.set(e.b,(deg.get(e.b)||0)+1)}
    for(const e of edges)if(e.on&&((deg.get(e.a)===1&&!imp.has(e.a))||(deg.get(e.b)===1&&!imp.has(e.b)))){e.on=false;ch=true}
  }
  for(const e of edges)if(e.on&&e.w)res.flow.add(e.w);
  return res;
}
function simCheck(S,r,exp){
  const mot=i=>S.comps.filter(c=>c.type==='motor'||c.type==='motor6')[i];
  const one=t=>S.comps.find(c=>c.type===t);
  if(S.tripped||r.short||r.chatter)return false;
  if('lamp' in exp){const c=one('lamp');if(!c||!!r.lit[c.id]!==exp.lamp)return false}
  if('trip' in exp){const c=one('lampRed');if(!c||!!r.lit[c.id]!==exp.trip)return false}
  if('motor' in exp){const c=mot(0);if(!c||(r.motor[c.id]||0)!==exp.motor)return false}
  if('m2' in exp){const c=mot(1);if(!c||(r.motor[c.id]||0)!==exp.m2)return false}
  if(exp.mode){const c=mot(0);if(!c||r.mode[c.id]!==exp.mode)return false}
  return true;
}
function runSync(def,tests){
  const S={comps:def.comps.map(c=>({...c,state:{}})),wires:def.wires.map(w=>({...w})),power:true,tripped:false,now:0};
  const first=(t,i=0)=>S.comps.filter(c=>c.type===t)[i];
  let r=solve(S);if(r.short)return false;
  for(const t of tests){
    for(const [a,type,val] of t.act){
      if(a==='wait'){S.comps.forEach(c=>{if(c.type==='timer'&&c.state.run)c.state.done=true});r=solve(S);if(r.short)return false;continue}
      const idx=(a==='press'||a==='release')?(val||0):0;const c=first(type,idx);if(!c)return false;
      if(a==='press')c.state.pressed=true;
      else if(a==='release'){c.state.pressed=false;if(c.type==='pbJog'){c.state.mid=true;r=solve(S);if(r.short)return false;c.state.mid=false}}
      else if(a==='set'){if(type==='overload')c.state.tripped=val;else c.state.on=val}
      r=solve(S);if(r.short)return false;
    }
    if(!simCheck(S,r,t.expect))return false;
  }
  return true;
}
const fref=r=>r.replace(':',' ขั้ว ');
function faultOps(def){
  const ops=[];
  def.wires.forEach(w=>{ops.push({k:'broken',w:w.id});ops.push({k:'missing',w:w.id})});
  def.comps.forEach(c=>{
    if(c.type==='contactor'){const has=t=>def.wires.some(w=>w.a===c.id+':'+t||w.b===c.id+':'+t);if(has('13')&&has('14')&&!has('21')&&!has('22'))ops.push({k:'nonc',c:c.id})}
    if(c.type==='motor')[['U','V'],['V','W'],['U','W']].forEach(([a,b])=>ops.push({k:'phase',c:c.id,a,b}));
  });
  return ops;
}
function applyOp(def,op){
  const w=op.w&&def.wires.find(x=>x.id===op.w);
  if(op.k==='broken'){if(!w||w.broken)return null;w.broken=true;return [`สาย ${fref(w.a)} ถึง ${fref(w.b)} ขาดในฉนวน มองด้วยตาไม่เห็น`,`Wire ${w.a} to ${w.b} broken inside the insulation, invisible from outside`]}
  if(op.k==='missing'){if(!w)return null;def.wires=def.wires.filter(x=>x!==w);return [`สาย ${fref(w.a)} ถึง ${fref(w.b)} หลุดหายไป`,`Wire ${w.a} to ${w.b} was missing`]}
  if(op.k==='nonc'){let n=0;def.wires.forEach(x=>['a','b'].forEach(e=>{if(x[e]===op.c+':13'){x[e]=op.c+':21';n++}else if(x[e]===op.c+':14'){x[e]=op.c+':22';n++}}));return n?[`ทางค้างของ ${op.c} ต่อผิดไปที่ 21-22 (NC) แทน 13-14`,`${op.c} holding contact wired to 21-22 (NC) instead of 13-14`]:null}
  if(op.k==='phase'){const A=op.c+':'+op.a,B=op.c+':'+op.b;const wa=def.wires.find(x=>x.a===A||x.b===A),wb=def.wires.find(x=>x.a===B||x.b===B);if(!wa||!wb||wa===wb)return null;
    const sw=(x,from,to)=>{if(x.a===from)x.a=to;else x.b=to};sw(wa,A,B);sw(wb,B,A);return [`สายเฟสเข้ามอเตอร์ ${op.c} ขั้ว ${op.a} กับ ${op.b} สลับกัน`,`Phases at motor ${op.c} terminals ${op.a} and ${op.b} swapped`]}
  return null;
}
function genFaulty(tpl,n,rnd=Math.random){
  const clone=()=>JSON.parse(JSON.stringify(tpl));
  const good=faultOps(tpl).filter(op=>{const d=clone();return applyOp(d,op)&&!runSync(d,tpl.tests)});
  const kinds=[...new Set(good.map(o=>o.k))];
  for(let tries=0;tries<40;tries++){
    const d=clone(),faults=[],used=new Set();
    for(let i=0;i<n*4&&faults.length<n;i++){
      const k=kinds[Math.floor(rnd()*kinds.length)];const pool=good.filter(o=>o.k===k&&!used.has(o.w||o.c));
      if(!pool.length||(k!=='broken'&&k!=='missing'&&faults.some(f=>f.k===k)))continue;
      const op=pool[Math.floor(rnd()*pool.length)];const desc=applyOp(d,op);
      if(desc){faults.push({k,desc});used.add(op.w||op.c)}
    }
    if(faults.length===n&&!runSync(d,tpl.tests))return {def:d,faults:faults.map(f=>f.desc)};
  }
  return null;
}

 1:{name:'First Light',place:'Spare parts room',goal:'Switch on: lamp lights. Switch off: lamp goes out.',

function mNote(f,t,d,type,v,{att=.005,cut=0}={}){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  let out=o;if(cut){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;o.connect(fl);out=fl}

  if(!nBuf){nBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const c=nBuf.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1}

  const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);

function playStep(step,t,spb){
  const M=SONGS[musicMode],bar=Math.floor(step/16)%4,st=step%16,[bass,ch]=M.chords[bar];
  if(musicMode==='fun'){
    if(st%4===0)mKick(t,.55);
    if(st===4||st===12)mNoise(t,.14,.22,'bandpass',1800);
    if(st%2===1)mNoise(t,.04,.08,'highpass',7000);
    if(st%2===0)mNote(mtof(bass+(st%8===4?12:0)),t,spb*1.7,'square',.07,{cut:700});
    mNote(mtof(ch[st%ch.length]+12),t,spb*.8,'triangle',.035);
    const ln=M.lead[(bar%2)*16+st];if(ln&&bar>=2)mNote(mtof(ln),t,spb*1.8,'square',.03,{cut:2400});
  }else{
    if(st===0)ch.forEach((n,i)=>mNote(mtof(n),t+i*.03,spb*15,i%2?'triangle':'sine',.035,{att:.6,cut:1400}));
    if(st===0||st===10)mKick(t,.32);

    if(st%4===2)mNoise(t,.03,.025,'highpass',8000);
    if(st===0||st===7||st===10)mNote(mtof(bass),t,spb*3,'sine',.11,{att:.02});
    const pent=[0,3,5,7,10].map(x=>x+ch[0]+12);

  }

  const wires=[...L.wires.filter(x=>x.locked).map(x=>({...x})),...w.wires.filter(x=>!x.locked&&has(x.a)&&has(x.b))];

function spark(){
  const c=S.comps.find(c=>T[c.type].sources);if(!c)return;const D=T[c.type];
  const cx=c.x+D.w-26,cy=c.y+20;let h=`<g class="spark"><circle cx="${cx}" cy="${cy}" r="8"/>`;

  h+='</g>';lyOver.insertAdjacentHTML('beforeend',h);const g=lyOver.lastElementChild;setTimeout(()=>g.remove(),700);

/* ---------- simulation update ---------- */
function update(){
  S.now=performance.now();
  const prev={};S.comps.forEach(c=>{if(c.type==='contactor')prev[c.id]=!!c.state.on});
  let r=solve(S);
  if(r.short){
    S.tripped=true;S.shortCount++;S.comps.forEach(c=>{if(c.type==='contactor')c.state.on=false});
    r=solve(S);r.justShorted=true;spark();sfx.spark();if(navigator.vibrate)navigator.vibrate(120);
    if(!testing)toast(I('ลัดวงจร! เบรกเกอร์ตัดไฟแล้ว หาสายที่ทำให้ไฟเฟสชนกับ N หรือเฟสชนกันเอง แก้แล้วกด รีเซ็ตเบรกเกอร์','Short circuit! The breaker tripped. Find the wire that connects a phase to N or two phases together, fix it, then press Reset breaker'),'bad',5200);
    saveWork();
  }
  let clicked=false;S.comps.forEach(c=>{if(c.type==='contactor'&&prev[c.id]!==!!c.state.on)clicked=true});
  if(clicked)sfx.click();
  if(r.chatter&&!chatterWarned&&!testing){chatterWarned=true;toast(I('คอนแทคเตอร์สั่นค้าง คอยล์ตัดไฟตัวเองผ่านหน้าสัมผัสของมันเอง ลองตรวจการต่อ 21-22','Contactor is chattering: its coil cuts its own supply through its own contact. Check the 21-22 wiring'),'info',5000)}
  if(!r.chatter)chatterWarned=false;
  S.sim=r;applyDynamic();updateStatus();renderLadderState();if(mode==='meter')renderMeter();
  return r;
}
function setPower(on){
  if(testing)return;audio();
  if(S.tripped){S.tripped=false;S.power=false;toast(I('รีเซ็ตเบรกเกอร์แล้ว แก้วงจรให้เรียบร้อยก่อนจ่ายไฟอีกครั้ง','Breaker reset. Fix the circuit before powering up again'),'info')}
  else S.power=on;
  sfx.tick();update();
}

/* ---------- editing ---------- */
function pushHistory(){history.push(JSON.stringify({comps:S.comps.map(({id,type,x,y,locked})=>({id,type,x,y,locked})),wires:S.wires}));if(history.length>60)history.shift()}

  pushHistory();
}
function remaining(type){if(cur.free)return Infinity;return (cur.tray[type]||0)-S.comps.filter(c=>c.type===type&&!c.locked).length}
function playerWires(){return S.wires.filter(w=>!w.locked).length}
function rectOf(c,D){return {x:c.x,y:c.y,w:D.w,h:D.h}}
function validPos(excl,x,y,D){
  if(x<0||y<0||x+D.w>PW||y+D.h>PH)return false;const m=8;
  for(const o of S.comps){if(o===excl)continue;const r=rectOf(o,T[o.type]);
    if(x<r.x+r.w+m&&x+D.w+m>r.x&&y<r.y+r.h+m&&y+D.h+m>r.y)return false}
  return true;
}
function newId(prefix){let n=1;while(S.comps.some(c=>c.id===prefix+n))n++;return prefix+n}
function placeAt(p){
  const D=T[placeType];if(remaining(placeType)<=0){setMode('select');return}
  const x=clamp(snap(p.x-D.w/2),0,PW-D.w),y=clamp(snap(p.y-D.h/2),0,PH-D.h);
  if(!validPos(null,x,y,D)){toast(I('ตรงนี้วางไม่ได้ ทับอุปกรณ์อื่นหรือชิดกันเกินไป','Can\'t place here: it overlaps or is too close to another device'),'bad');return}
  beforeEdit();const id=newId(D.tag);
  S.comps.push({id,type:placeType,x,y,locked:false,state:{}});
  sfx.tick();selection={kind:'comp',id};
  if(remaining(placeType)<=0)setMode('select');
  renderScene();renderTray();update();saveWork();
}
function staticSrc(ref){
  const uf=new UF();for(const w of S.wires)uf.union(w.a,w.b);const r=uf.find(ref);
  for(const c of S.comps){const D=T[c.type];if(D.sources)for(const t in D.sources)if(uf.find(c.id+':'+t)===r)return D.sources[t]}
  return null;
}
function addWire(a,b){

  const cnt=r=>S.wires.filter(w=>w.a===r||w.b===r).length;
  if(cnt(a)>=3||cnt(b)>=3){toast(I('ขั้วหนึ่งใส่สายได้สูงสุด 3 เส้น','A terminal takes at most 3 wires'),'info');return false}
  beforeEdit();

const pts=new Map();let gest=null;
function releaseBtn(c){if(!c.state.pressed)return;c.state.pressed=false;if(c.type==='pbJog'){c.state.mid=true;update();c.state.mid=false}update()}

  }

  const base={sx:e.clientX,sy:e.clientY,p,v0:{...view},scale:svg.getScreenCTM().a,moved:false};
  const tEl=e.target.closest('[data-term]'),aEl=e.target.closest('[data-act]');let wEl=e.target.closest('[data-wire]'),cEl=e.target.closest('[data-comp]');

  }
  if(mode==='meter'){gest={...base,kind:'pan'};return}
  if(wEl){selection={kind:'wire',id:wEl.dataset.wire};renderScene();gest={...base,kind:'pan'};return}

  if(cid){

    gest=c.locked?{...base,kind:'pan'}:{...base,kind:'drag',id:cid,ox:c.x,oy:c.y};return;

svg.addEventListener('pointermove',e=>{

  }

function pointerEnd(e){

/* ---------- motor animation ---------- */
const anim={};let lastT=0;
function frame(t){
  const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;let maxS=0,hum=false;
  if(S&&cur&&S.sim){
    const now=performance.now();let fire=false;
    for(const c of S.comps)if(c.type==='timer'){
      const st=c.state;if(st.run&&!st.done&&now-st.t0>=TR_PRESET){st.done=true;fire=true}
      const g=lyComps.querySelector(`[data-comp="${CSS.escape(c.id)}"]`);
      if(g){const left=st.done?0:st.run?Math.max(0,TR_PRESET-(now-st.t0)):TR_PRESET;
        g.querySelector('.tr-txt').textContent=st.done?I('ครบ','Done'):(left/1000).toFixed(1)+'s';
        g.querySelector('.tr-arc').style.strokeDashoffset=(106.8*(left/TR_PRESET)).toFixed(1)}
    }
    if(fire)update();

function bindVal(k){

    case 'kdnc':{const c=byId('KD');return !!(c&&!c.state.on)}
    case 'tr':{const c=first('timer');return !!(c&&c.state.run)}
    case 'trdone':{const c=first('timer');return !!(c&&c.state.done)}

  let x=c.x+T[c.type].w/2,y=c.y+T[c.type].h/2;
  if(a){const b=a.getBBox();x=c.x+b.x+b.width/2;y=c.y+b.y+b.height/2}
  lyOver.insertAdjacentHTML('beforeend',`<g class="tapmark${hold?' hold':''}" data-for="${esc(c.id)}"><circle class="tm-pulse" cx="${x}" cy="${y}" r="20"/><circle class="tm-ring" cx="${x}" cy="${y}" r="24"/><rect class="tm-tag" x="${x-24}" y="${y-48}" width="48" height="18" rx="9"/><text class="tm-txt" x="${x}" y="${y-35}" text-anchor="middle">${label}</text></g>`);
  if(!hold){const n=lyOver.lastElementChild;setTimeout(()=>n.remove(),1100)}
}
function hudPad(){const h=$('#hud');return h.hidden?0:h.offsetHeight+16}
function endTestUI(){
  $('#hud').hidden=true;$('#game').classList.remove('testing');
  lyOver.querySelectorAll('.tapmark').forEach(n=>n.remove());
  requestAnimationFrame(()=>fitView());
}
let lastRun=null;
function showRunList(){
  const sh=$('#sheet');sh.hidden=false;const {res,msg,failI}=lastRun;
  sh.innerHTML=`<div class="sheet-h"><b>${I('ผลการทดสอบ','Test results')}</b><button class="btn quiet" data-x>${I('ปิด','Close')}</button></div><ol class="steps">${cur.tests.map((t,i)=>`<li class="st-${res[i]==='ok'?'ok':res[i]==='bad'?'bad':'wait'}"><span class="mk">${res[i]==='ok'?'✓':res[i]==='bad'?'✗':i+1}</span><span>${esc(testLabel(tlab(t)))}${i===failI?`<small>${esc(msg)}</small>`:''}</span></li>`).join('')}</ol>`;
  sh.querySelector('[data-x]').onclick=()=>sh.hidden=true;
}
async function runTests(){
  if(testing||!cur||cur.free)return;audio();
  testing=true;setMode('select');selection=null;$('#sheet').hidden=true;
  S.comps.forEach(c=>{c.state.pressed=false;c.state.mid=false;if(c.type==='contactor')c.state.on=false;if(c.type==='switch')c.state.on=false;if(c.type==='overload')c.state.tripped=false;if(c.type==='timer'){c.state.run=false;c.state.done=false}});
  S.tripped=false;S.power=true;renderScene();update();
  const n=cur.tests.length,res=cur.tests.map(()=>'wait'),hud=$('#hud');
  const draw=(i,extra='')=>{hud.innerHTML=`<div class="hd-row"><span>${I(`ทดสอบข้อ ${i+1} จาก ${n}`,`Test ${i+1} of ${n}`)}</span><span class="dots">${res.map(r=>`<i class="${r}"></i>`).join('')}</span></div><div class="hd-txt">${esc(testLabel(tlab(cur.tests[i])))}</div>${extra}`};
  $('#game').classList.add('testing');hud.className='hud';hud.hidden=false;draw(0);
  await frame2();fitView(hudPad());
  let msg='',failI=-1;
  await sleep(600);
  for(let i=0;i<n;i++){
    const t=cur.tests[i];res[i]='run';draw(i);
    for(const [a,type,val] of t.act){
      if(a==='wait'){draw(i,`<div class="hd-bar"><i style="animation-duration:${val}ms"></i></div>`);await sleep(val);continue}
      const idx=(a==='press'||a==='release')?(val||0):0;
      const c=first(type,idx);if(!c){msg=I(`ยังไม่มี${T[type].name}${idx?` ตัวที่ ${idx+1}`:''}บนแผง`,`${nm(type)}${idx?` #${idx+1}`:''} is not on the panel`);break}
      if(a==='press'){c.state.pressed=true;tapMark(c,I('กดค้าง','Hold'),true)}
      else if(a==='release'){releaseBtn(c);tapMark(c,I('ปล่อย','Release'),false)}
      else if(a==='set'){if(type==='overload'){c.state.tripped=val;tapMark(c,val?'TRIP':'RESET',false)}else{c.state.on=val;tapMark(c,val?I('เปิด','On'):I('ปิด','Off'),false)}}
      sfx.tick();update();await sleep(650);
    }
    if(!msg){await sleep(800);msg=checkExpect(t.expect)}
    if(msg){res[i]='bad';failI=i;msg=msg+(ttip(t)&&!cur.repair?' '+ttip(t):'');break}
    res[i]='ok';sfx.step();draw(i);await sleep(300);
  }
  releaseAllPush();update();lyOver.querySelectorAll('.tapmark.hold').forEach(n=>n.remove());
  testing=false;lastRun={res,msg,failI};
  if(failI<0){
    hud.className='hud ok';hud.innerHTML=`<div class="hd-row"><span>${I(`ทดสอบครบ ${n} ข้อ`,`All ${n} tests run`)}</span><span class="dots">${res.map(r=>`<i class="${r}"></i>`).join('')}</span></div><div class="hd-txt">${I('ผ่านทุกข้อ','All passed')}</div>`;
    sfx.ok();setTimeout(()=>{endTestUI();complete()},1300);
  }else{
    sfx.fail();hud.className='hud bad';
    draw(failI,`<div class="hd-msg">${esc(msg)}</div><div class="hd-btns"><button class="btn" data-d>${I('ดูทุกข้อ','All results')}</button><button class="btn" data-h>${I('คำใบ้','Hint')}</button><button class="btn primary" data-x>${I('ปิด','Close')}</button></div>`);
    hud.querySelector('[data-x]').onclick=()=>{endTestUI();S.power=false;S.tripped=false;update()};
    hud.querySelector('[data-d]').onclick=()=>{endTestUI();showRunList()};
    hud.querySelector('[data-h]').onclick=()=>{endTestUI();showHint()};
    await frame2();fitView(hudPad());
  }
}
$('#btnTest').onclick=runTests;

function complete(){
  if(cur.repair){completeRepair();return}
  const L=cur;S.done=true;
  const seen=progress.levels[L.id]||{};
  if(seen.peek){
    saveWork();const nx=LEVELS.find(l=>l.id===L.id+1);
    openModal(`<div class="bigstars"><span>📖</span></div>
      <h2 style="text-align:center">${I('วงจรทำงานถูกต้อง','The circuit works')}</h2>
      <p class="meta" style="text-align:center">${I('ด่านนี้ดูเฉลยแล้ว จึงไม่นับคะแนน','You viewed the solution, so this level does not score.')}${seen.stars>0?I(` คะแนนเดิม ${(seen.score||0).toLocaleString()} ยังอยู่`,` Your earlier ${(seen.score||0).toLocaleString()} pts stay.`):''}</p>
      <div class="row"><button class="btn quiet" data-stay>${I('อยู่ต่อในด่าน','Stay here')}</button><button class="btn" data-map>${I('แผนที่','Map')}</button>${nx?`<button class="btn primary" data-next>${I('ด่านถัดไป','Next level')}</button>`:`<button class="btn primary" data-sum>${I('สรุปผลทดสอบ','Test summary')}</button>`}</div>`,
      c=>{c.querySelector('[data-stay]').onclick=()=>{closeModal();S.power=false;update()};
        c.querySelector('[data-map]').onclick=()=>{closeModal();leaveLevel()};
        const n=c.querySelector('[data-next]');if(n)n.onclick=()=>{closeModal();leaveLevel();if(nx.ready)showBrief(nx)};
        const sm=c.querySelector('[data-sum]');if(sm)sm.onclick=()=>{closeModal();leaveLevel();showSummary()}});
    return;
  }
  const b1=playerWires()<=L.wireTarget,b2=S.shortCount===0;
  const stars=1+(b1?1:0)+(b2?1:0);
  const tb=S.elapsed<=L.targetTime?500:Math.max(0,Math.round(500*(1-(S.elapsed-L.targetTime)/(L.targetTime*2))));
  const score=stars*1000+tb;
  const prev=progress.levels[L.id]||{};
  const best=score>(prev.score||0);
  progress.levels[L.id]={stars:Math.max(stars,prev.stars||0),score:Math.max(score,prev.score||0),b1:b1||!!prev.b1,b2:b2||!!prev.b2,time:Math.min(S.elapsed,prev.time||Infinity)};
  store.set('e3pt-progress-v1',progress);saveWork();
  const next=LEVELS.find(l=>l.id===L.id+1);
  const allDone=LEVELS.every(l=>progress.levels[l.id]&&progress.levels[l.id].stars>0);
  openModal(`<div class="bigstars">${[0,1,2].map(i=>`<span style="animation-delay:${i*.18}s"${i<stars?'':' class="dim"'}>★</span>`).join('')}</div>
    <h2 style="text-align:center">${I(`ผ่านด่าน ${L.id}`,`Level ${L.id} complete`)}</h2>
    <div class="who">${AV}<div class="bubble"><b>${I('ผู้อำนวยการฝ่ายผลิต','Production Director')}</b>${esc(lv(L,'praise'))}</div></div>
    <table class="score">
      <tr><td>${I(`ดาว ${stars} ดวง`,`${stars} star${stars>1?'s':''}`)}</td><td>${(stars*1000).toLocaleString()}</td></tr>
      <tr><td>${I('เวลา','Time')} ${fmt(S.elapsed)} (${I('เป้า','target')} ${fmt(L.targetTime)})</td><td>${tb}</td></tr>
      <tr class="total"><td>${I('รวม','Total')}${best?I(' สถิติใหม่',' New best'):''}</td><td>${score.toLocaleString()}</td></tr>
    </table>
    <div class="goalbox"><ul>
      <li class="got"><span>★</span>${esc(lv(L,'goal'))}</li>
      <li class="${b1?'got':''}"><span>${b1?'★':'☆'}</span>${I(`ใช้สายไม่เกิน ${L.wireTarget} เส้น (ใช้ ${playerWires()})`,`Use no more than ${L.wireTarget} wires (used ${playerWires()})`)}</li>
      <li class="${b2?'got':''}"><span>${b2?'★':'☆'}</span>${I(`ไม่ลัดวงจรเลยสักครั้ง (ลัด ${S.shortCount} ครั้ง)`,`No short circuits (shorts: ${S.shortCount})`)}</li>
    </ul></div>
    <div class="row"><button class="btn quiet" data-stay>${I('อยู่ต่อในด่าน','Stay here')}</button><button class="btn" data-map>${I('แผนที่','Map')}</button>${allDone||!next?`<button class="btn primary" data-sum>${I('สรุปผลทดสอบ','Test summary')}</button>`:`<button class="btn primary" data-next>${I('ด่านถัดไป','Next level')}</button>`}</div>`,
    c=>{c.querySelector('[data-stay]').onclick=()=>{closeModal();S.power=false;update()};
      c.querySelector('[data-map]').onclick=()=>{closeModal();leaveLevel()};
      const n=c.querySelector('[data-next]');if(n)n.onclick=()=>{closeModal();leaveLevel();if(next.ready)showBrief(next)};
      const sm=c.querySelector('[data-sum]');if(sm)sm.onclick=()=>{closeModal();leaveLevel();showSummary()}});
}

/* ---------- pre-test summary ---------- */
function summaryData(){
  const rows=LEVELS.map(L=>({L,p:progress.levels[L.id]||null}));
  const done=rows.filter(r=>r.p&&r.p.stars>0).length;
  const sc=totalScore(),tt=rows.reduce((s,r)=>s+((r.p&&r.p.time)||0),0);
  return {rows,done,sc,tt,rank:rankOf(sc).r};
}
function summaryText(name){
  const {rows,done,sc,tt,rank}=summaryData();
  return ['E3.series Pre-test · Motor Control Lab','ชื่อ: '+(name||'-'),`ผ่าน ${done}/${rows.length} ด่าน · ${sc.toLocaleString()} คะแนน · เวลารวม ${fmt(tt)} · ระดับ ${rank[1]}`,
    ...rows.map(r=>`ด่าน ${r.L.id} ${r.L.name}: `+(r.p&&r.p.stars>0?`${'★'.repeat(r.p.stars)}${'☆'.repeat(3-r.p.stars)} ${fmt(r.p.time)} ${r.p.score} คะแนน`:'ยังไม่ผ่าน')+(r.p&&r.p.peek?' (ดูเฉลย)':''))].join('\n');
}
function showSummary(){
  const {rows,done,sc,tt,rank}=summaryData();
  const miss=rows.filter(r=>!(r.p&&r.p.stars>0)).map(r=>`${I('ด่าน','Level')} ${r.L.id} ${lv(r.L,'name')}`);
  const name=store.get('e3pt-name','');
  openModal(`<h2>${I('สรุปผลทดสอบก่อนเรียน','Pre-test summary')}</h2>
    <p class="meta">Motor Control Lab · E3.series</p>
    <label class="namefield">${I('ชื่อผู้ทดสอบ','Name')}<input id="sumName" type="text" maxlength="60" value="${esc(name)}" placeholder="${I('พิมพ์ชื่อ','Type name')}"></label>
    <div class="sumhead"><div><b>${done}/${rows.length}</b><small>${I('ด่านที่ผ่าน','levels passed')}</small></div><div><b>${sc.toLocaleString()}</b><small>${I('คะแนนรวม','total score')}</small></div><div><b>${fmt(tt)}</b><small>${I('เวลารวม','total time')}</small></div></div>
    <p class="rankline">${I('ระดับ','Level')}: <b>${esc(rankName(rank))}</b></p>
    <table class="score">${rows.map(r=>`<tr><td>${r.L.id}. ${esc(lv(r.L,'name'))}</td><td>${r.p&&r.p.stars>0?starStr(r.p.stars)+' · '+fmt(r.p.time):'—'}${r.p&&r.p.peek?` <span class="jb-peek">${I('ดูเฉลย','Solution')}</span>`:''}</td></tr>`).join('')}</table>
    ${miss.length?`<p class="meta">${I('หัวข้อที่ควรเน้นในคลาส','Topics to stress in class')}: ${esc(miss.join(', '))}</p>`:`<p class="meta">${I('ผ่านครบทุกด่าน พื้นฐานแน่นพร้อมเรียน E3','All levels passed: ready for E3')}</p>`}
    <div class="row"><button class="btn quiet" data-x>${I('ปิด','Close')}</button><button class="btn" data-copy>${I('คัดลอกผล','Copy result')}</button></div>`,
    c=>{const inp=c.querySelector('#sumName');inp.oninput=()=>store.set('e3pt-name',inp.value);
      c.querySelector('[data-x]').onclick=closeModal;
      c.querySelector('[data-copy]').onclick=async()=>{try{await navigator.clipboard.writeText(summaryText(inp.value));toast(I('คัดลอกผลแล้ว','Result copied'),'ok')}catch(e){toast(I('คัดลอกไม่ได้ ถ่ายภาพหน้าจอแทนได้','Copy failed, take a screenshot instead'),'info')}closeModal()}});
}

function completeRepair(){
  const L=cur;S.done=true;
  const tb=S.elapsed<=L.targetTime?500:Math.max(0,Math.round(500*(1-(S.elapsed-L.targetTime)/(L.targetTime*2))));
  const ns=S.shortCount===0?250:0,score=750+tb+ns;
  const rp=progress.repair||{jobs:0,best:0,points:0};const best=score>(rp.best||0);
  progress.repair={jobs:(rp.jobs||0)+1,best:Math.max(score,rp.best||0),points:(rp.points||0)+score};
  store.set('e3pt-progress-v1',progress);store.del('e3pt-repair-job');delete works.R;store.set('e3pt-work-v1',works);
  const praise=[I('ลูกค้าโทรมาชมเลยครับ เครื่องกลับมาเดินได้แล้ว','The customer called to say thanks. The machine is running again.'),I('ซ่อมไวมาก ไลน์ผลิตแทบไม่ต้องหยุดรอเลยครับ','That was quick. The line barely had to stop.'),I('เรียบร้อยดีครับ ช่างกะเช้าฝากขอบคุณมาด้วย','All good. The morning shift says thanks.')][Math.floor(Math.random()*3)];
  openModal(`<div class="bigstars"><span>🔧</span></div><h2 style="text-align:center">${I('ซ่อมเสร็จ','Repair complete')}</h2>
    <div class="who">${AV}<div class="bubble"><b>${I('ผู้อำนวยการฝ่ายผลิต','Production Director')}</b>${praise}</div></div>
    <p class="meta">${I('จุดเสียในงานนี้','Faults in this job')}</p><ul class="faults">${L.faults.map(f=>`<li>${esc(Array.isArray(f)?I(f[0],f[1]):f)}</li>`).join('')}</ul>
    <table class="score">
      <tr><td>${I('ค่าซ่อม','Repair fee')}</td><td>750</td></tr>
      <tr><td>${I('เวลา','Time')} ${fmt(S.elapsed)} (${I('เป้า','target')} ${fmt(L.targetTime)})</td><td>${tb}</td></tr>
      <tr><td>${I('ไม่ลัดวงจร','No shorts')}</td><td>${ns}</td></tr>
      <tr class="total"><td>${I('รวม','Total')}${best?I(' สถิติใหม่',' New best'):''}</td><td>${score.toLocaleString()}</td></tr>
    </table>
    <div class="row"><button class="btn" data-map>${I('แผนที่','Map')}</button><button class="btn primary" data-next>${I('รับงานถัดไป','Next job')}</button></div>`,
    c=>{c.querySelector('[data-map]').onclick=()=>{closeModal();leaveLevel()};c.querySelector('[data-next]').onclick=()=>{closeModal();leaveLevel();newJob()}});
}

/* ---------- boot ---------- */
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
applyStatic();refreshSoundBtns();renderMap();
})();
</script>
